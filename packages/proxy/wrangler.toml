name = "office-agents-cors-proxy"
main = "src/worker.js"
compatibility_date = "2025-09-01"
workers_dev = true

[vars]
ALLOWED_ORIGINS = "https://openword-longpt.pages.dev,https://openexcel-longpt.pages.dev,https://openppt-longpt.pages.dev,https://localhost:3000,https://localhost:3001,https://localhost:3002"
ALLOWED_TARGETS = "opencode.ai,api.anthropic.com,api.openai.com,generativelanguage.googleapis.com"
# DASHBOARD_PASSWORD must not be committed. Set it on the deployed worker with:
#   wrangler secret put DASHBOARD_PASSWORD

[[d1_databases]]
binding = "ANALYTICS"
database_name = "office-agents-analytics"
database_id = "30c6a8f8-fbf3-43c5-953e-01e24d882acb"
